name: Studio validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: studio-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, type, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - name: Verify pinned producer contracts
        run: |
          node --test tools/verify-contract-pins.test.mjs
          node tools/verify-contract-pins.mjs
          node tools/generate-effective-limit-validators.mjs --check
          (cd contracts/recorded-run-candidate && sha256sum --check --strict SHA256SUMS)
      - name: Verify Phase 2 requirement/acceptance reconciliation
        run: node --test tools/verify-phase2-reconciliation.test.mjs
      - name: Verify live owner diagnostic preservation
        run: node --test tools/live-owner-diagnostics.test.mjs
      - name: Verify PERF-08 bundle budget measurement
        run: npm run test:bundle-budget
      - run: npm run lint
      - run: npm test -- --run --pool=threads --maxWorkers=1
      - run: npm run build
      - name: Verify PERF-08 against the real production build
        run: npm run measure:bundle-budget

  browser:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - run: npm run test:effective-limits-browser -- --project=${{ matrix.browser }}
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.browser }}-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  recorded-browser:
    name: Recorded-run browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:recorded-browser
      - name: Upload recorded-run diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recorded-run-browser-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  producer-seal:
    name: Inference-profile producer seal
    runs-on: ubuntu-latest
    # The core step cold-builds the seal crate, which path-depends on the whole
    # `sts2-harness` producer. The warm case (run 36765563977, head 204b193) took
    # 3m32s; a pessimistic cold build on a loaded host measured 52m07s. The
    # budget must clear the worst measured case with margin, so it is set well
    # above 52 minutes rather than tuned to the typical run. The linked crate's
    # compiled artefacts are cached below, which is what pulls the real p50 down
    # toward the 3m32s figure; the timeout is the backstop for a cold cache.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Read the producer revision this fixture was sealed against
        id: producer
        run: |
          echo "revision=$(jq -r .revision contracts/inference-profile-catalog.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-Ascension/sts2-harness
          ref: ${{ steps.producer.outputs.revision }}
          path: harness
          persist-credentials: false
      - name: Confirm the pinned revision still ships the producer contract
        working-directory: harness
        run: |
          test -f crates/harness/src/management/contract_inference_profile.rs
      - name: Install the pinned owner's Rust toolchain
        working-directory: harness
        run: rustup show active-toolchain
      # Cache keyed on the seal crate's lockfile AND on the pinned producer
      # revision, because the crate path-depends on the sibling `harness/`
      # checkout: a new producer revision changes that crate's sources and must
      # invalidate the cache, while an unchanged revision and lockfile can
      # reuse the compiled dependency graph. This makes the cache a speed
      # optimisation only: `--locked` still fails on a lockfile that does not
      # match, and `--require-producer-checkout` still fails if the checkout is
      # absent, so no cached artefact can stand in for a check.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: harness/target
          key: producer-seal-${{ steps.producer.outputs.revision }}-${{ hashFiles('tools/inference-profile-conformance-seal/Cargo.lock') }}
      - name: Build the seal against the pinned owner
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/harness/target
          STS2_HARNESS_PRODUCER_REVISION: ${{ steps.producer.outputs.revision }}
        run: |
          cargo build --locked --release \
            --manifest-path tools/inference-profile-conformance-seal/Cargo.toml
          test -x harness/target/release/studio-inference-profile-conformance-seal
      - name: Re-seal and require byte equality with the checked-in fixture
        # The strict flag fails if the producer checkout is missing or the seal
        # binary was not built, so this job cannot pass by skipping the only
        # checks that make the provenance claim meaningful.
        run: node tools/verify-contract-pins.mjs --require-producer-checkout

  live-owner-browser:
    name: Authenticated live-owner browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the current tested owner pin
        id: owner
        run: |
          jq -e '.repository == "AI-Ascension/sts2-harness" and
            (.revision | test("^[0-9a-f]{40}$")) and
            .gateway_repository == "AI-Ascension/sts2-gateway" and
            (.gateway_revision | test("^[0-9a-f]{40}$")) and
            .mcp_repository == "AI-Ascension/sts2-mcp-server" and
            (.mcp_revision | test("^[0-9a-f]{40}$"))' contracts/live-owner-ci.lock.json > /dev/null
          echo "revision=$(jq -r .revision contracts/live-owner-ci.lock.json)" >> "$GITHUB_OUTPUT"
          echo "gateway_revision=$(jq -r .gateway_revision contracts/live-owner-ci.lock.json)" >> "$GITHUB_OUTPUT"
          echo "mcp_revision=$(jq -r .mcp_revision contracts/live-owner-ci.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-Ascension/sts2-harness
          ref: ${{ steps.owner.outputs.revision }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-Ascension/sts2-gateway
          ref: ${{ steps.owner.outputs.gateway_revision }}
          path: gateway
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AI-Ascension/sts2-mcp-server
          ref: ${{ steps.owner.outputs.mcp_revision }}
          path: mcp
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Install the pinned owner's Rust toolchain
        working-directory: harness
        run: rustup show active-toolchain
      - name: Build the pinned owner
        working-directory: harness
        run: cargo build --locked --bin sts2-workflow --bin sts2-harness-runtime
      - name: Build the pinned gateway process
        working-directory: gateway
        run: cargo build --locked --bin sts2-gateway-runtime
      - name: Build the pinned MCP process
        working-directory: mcp
        run: cargo build --locked --bin sts2-mcp-server
      - name: Build the policy fixture helper against the pinned owner
        working-directory: harness
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/harness/target
        run: cargo build --locked --manifest-path ../tools/provider-policy-production-fixture/Cargo.toml
      - run: STS2_WORKFLOW_TOKEN_STUDIO_LIVE=studio-live-ci-token harness/target/debug/sts2-workflow serve --listen 127.0.0.1:4185 --store /tmp/studio-live.sqlite --auth-profile studio-live > /tmp/studio-live.log 2>&1 &
      - run: |
          for attempt in {1..30}; do
            curl --fail --silent --show-error -H 'Authorization: Bearer studio-live-ci-token' http://127.0.0.1:4185/v1/health && exit 0
            sleep 1
          done
          cat /tmp/studio-live.log
          exit 1
      - name: Owner-restart persistence (AT-046)
        env:
          STS2_WORKFLOW_BIN: harness/target/debug/sts2-workflow
        run: npm run test:owner-restart
      - name: Owner negative authentication, Origin and CSRF (Studio #109 AC5)
        env:
          STS2_WORKFLOW_BIN: harness/target/debug/sts2-workflow
        run: npm run test:owner-negative-auth
      - run: npm run test:live-owner-browser
      - name: Production served policy routes in Studio
        env:
          STUDIO_HARNESS_ROOT: ${{ github.workspace }}/harness
          STUDIO_HARNESS_RUNTIME_BINARY: ${{ github.workspace }}/harness/target/debug/sts2-harness-runtime
          STUDIO_GATEWAY_BINARY: ${{ github.workspace }}/gateway/target/debug/sts2-gateway-runtime
          STUDIO_MCP_BINARY: ${{ github.workspace }}/mcp/target/debug/sts2-mcp-server
          STUDIO_PROVIDER_POLICY_CARGO_TARGET_DIR: ${{ github.workspace }}/harness/target
        run: npm run test:production-policy-browser
      - name: Show live owner diagnostics
        if: failure()
        run: |
          cat /tmp/studio-live.log
          # The Studio proxy is the only process that knows whether a 502 came
          # from a refused socket, a reset upstream, or an answered request.
          test -f tmp/studio-live-proxy.log && cat tmp/studio-live-proxy.log
          # The owner's own stdout/stderr is the only source that can say what
          # it did about a request it abandoned. These are written outside the
          # fixture directory cleanup removes, so they survive to this point
          # (studio#227).
          for capture in /tmp/studio-live-diagnostics/*/owner-std*.log /tmp/studio-live-diagnostics/*/gateway-std*.log; do
            if [ -f "$capture" ]; then
              echo "===== $capture ====="
              cat "$capture"
            fi
          done
      - name: Upload live owner browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-owner-browser-diagnostics
          path: |
            playwright-report
            test-results
            /tmp/studio-live-diagnostics
            tmp/studio-live-proxy.log
          if-no-files-found: ignore
          retention-days: 7
