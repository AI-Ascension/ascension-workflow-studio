[package]
name = "studio-inference-profile-conformance-seal"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
serde_json = "=1.0.151"
# The seal links the PRODUCER crate itself, exactly as
# `tools/provider-policy-production-fixture` does for the live-owner job.
# Every digest below therefore comes from the owner's own
# `InferenceProfileDescriptor::seal` / `inference_catalog_digest`; this crate
# contains no digest arithmetic of its own. `path` is relative to this
# manifest, and the sibling `harness/` checkout is pinned to
# `contracts/inference-profile-catalog.lock.json` by CI.
sts2-harness = { path = "../../harness/crates/harness" }
